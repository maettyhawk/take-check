[project]
name = "take-check"
version = "1.0.0"
description = "Instrumentaufnahme gegen Vorlage prüfen – Gitarren-Takes (DI) mit Guitar-Pro-/MusicXML-Vorlagen vergleichen"
requires-python = ">=3.12,<3.13"
dependencies = [
    "basic-pitch>=0.4",
    "fastapi>=0.162.0",
    "librosa>=1.0.0",
    "mido>=1.3.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
take-check = "take_check.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.1.1",
]

[tool.uv]
# basic-pitch zieht unter Linux ein altes TensorFlow (kein cp312); wir nutzen das mitgelieferte ONNX-Modell.
override-dependencies = [
    "tensorflow; sys_platform == 'linux' and sys_platform == 'darwin'",
    "tflite-runtime; sys_platform == 'linux' and sys_platform == 'darwin'",
    "coremltools; sys_platform == 'linux' and sys_platform == 'darwin'",
    "tensorflow-macos; sys_platform == 'linux' and sys_platform == 'darwin'",
    "numpy>=2",
    "resampy>=0.4.3",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
